---
layout: layout-site.html
---
<article class="project-column flex-column gap-xl">
    {% if indexPath %}
    <nav class="back-nav" aria-label="Back">
        <a class="back-link" href="{{ indexPath | url }}">&larr; Back to all projects</a>
    </nav>
    {% endif %}
    <header class="flex-column gap-xl">
        <div class="flex-row gap-xl project-header-row">
            <div class="icon-container shadow-sm flex-align-self-start">
                <span class="material-symbols-outlined project-icon rounded flex-row flex-align-center justify-center">{{ icon }}</span>
            </div>
            <div class="flex-column gap-sm">
                <h1 class="text-h1 font-mono">{{ title }}</h1>
                <p class="text-h5 muted readable">{{ description }}</p>
                {% if topics %}
                <div class="cluster">
                    {% for topic in topics %}<span class="tag tag--technical border-1">{{ topic }}</span>{% endfor %}
                </div>
                {% endif %}
            </div>
        </div>
        {% if github %}
        <a href="{{ github }}" target="_blank" rel="noopener noreferrer" class="connect-btn connect-btn--github flex-row flex-align-center flex-align-self-start gap-sm padding-horizon-md padding-vert-sm"><img src="/assets/github-mark.svg" width="20px" height="20px" eleventy:ignore><p>View on GitHub</p></a>
        {% endif %}
    </header>
    <div class="readable project-body">
        {{ content }}
    </div>
</article>
