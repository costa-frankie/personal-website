<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400&family=Covered+By+Your+Grace&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/tofers-table.css">
</head>
<body>
    <header>
        {% if indexPath and page.url != indexPath %}
        <p class="back-link"><a href="{{ indexPath | url }}">&larr; Back to all recipes</a></p>
        {% endif %}
        <h1>{{ title }}</h1>
        {% if page.url != indexPath %}
        <p class="post-date">{{ page.date | readableDate }}</p>
        {% endif %}
    </header>
    {% if page.url != indexPath %}
    <div class="recipe-card">
        <main>{{ content }}</main>
    </div>
    {% else %}
    <main>{{ content }}</main>
    {% endif %}
</body>
</html>
