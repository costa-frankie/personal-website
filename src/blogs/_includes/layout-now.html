<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../../../assets/fc-favicon.svg">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/now.css">
</head>
<body>
    <header>
        <div class="flex-row flex-align-center gap-md cursor-default min-28">
            <p class="border-thick-black" id="nav-logo-text">FC</p>
            <h1 class="font-wider"><a href="/">frankie-costa</a><span class="muted"> /now</span></h1>
        </div>

        {% if indexPath and page.url != indexPath %}
        <p class="back-link"><a href="{{ indexPath | url }}">&larr; Back to all posts</a></p>
        {% endif %}
        <h2>{{ title }}</h2>
        {% if page.url != indexPath %}
        <p class="post-date">{{ page.date | readableDate }}</p>
        {% endif %}
    </header>
    <main>
        {{ content }}
    </main>
</body>
</html>
