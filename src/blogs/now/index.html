---
title: What I'm Doing Now
eleventyExcludeFromCollections: true
---
<ul class="post-list">
{% for post in collections.nowPosts reversed %}
    <li>
        <a href="{{ post.url | url }}">{{ post.data.title }}</a>
        <span class="post-date">{{ post.date | readableDate }}</span>
    </li>
{% endfor %}
</ul>
